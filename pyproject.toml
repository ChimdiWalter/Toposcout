[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "toposcout"
version = "0.1.0"
description = "Autonomous topology-guided scientific imaging agent"
requires-python = ">=3.11"
dependencies = [
  "google-adk[gcp]>=2.0.0,<3.0.0",
  "google-genai>=2.0.0",
  "pillow>=10.0.0",
  "numpy>=1.26.0",
  "requests>=2.31.0",
  "google-cloud-storage>=2.16.0",
  "google-cloud-firestore>=2.19.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
packages = ["app", "toposcout_core", "scientific_worker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
